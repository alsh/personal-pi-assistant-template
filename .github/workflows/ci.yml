name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:policy
      - run: npm run check:permissions
      - run: bash -n scripts/*.sh
